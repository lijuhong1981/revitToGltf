<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revit 导出对比 · FBX vs glTF</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f26;
    --border: #2b3038;
    --text: #e4e7ec;
    --dim: #8b94a3;
    --accent: #4a9eff;
    --good: #3ecf8e;
    --warn: #f0b429;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  body { display: flex; flex-direction: column; }

  header {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    background: var(--panel); flex: none;
  }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; }
  header .hint { color: var(--dim); font-size: 12px; }
  header .spacer { flex: 1; }
  header label { display: flex; align-items: center; gap: 6px; color: var(--dim); cursor: pointer; user-select: none; }
  header button {
    background: #262b33; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer;
  }
  header button:hover { background: #303742; }
  header button.active { background: var(--accent); color: #0b0d10; border-color: var(--accent); }
  .hidden { display: none !important; }

  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  .panel {
    position: relative; display: flex; flex-direction: column;
    border-right: 1px solid var(--border); min-width: 0; min-height: 0;
  }
  .panel:last-child { border-right: none; }
  .panel-head {
    padding: 8px 14px; font-weight: 600; font-size: 12px;
    border-bottom: 1px solid var(--border); background: var(--panel);
    display: flex; align-items: center; gap: 10px; flex: none;
  }
  .panel-head .badge {
    font-weight: 400; font-size: 11px; color: var(--dim);
    border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px;
  }
  .panel-head select {
    background: #262b33; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 8px; font-size: 12px; cursor: pointer; max-width: 240px;
  }
  .panel-head select:disabled { opacity: .5; cursor: wait; }
  .viewport { flex: 1; position: relative; min-height: 0; }
  .viewport canvas { display: block; }

  .overlay {
    position: absolute; left: 12px; top: 12px;
    background: rgba(20,22,26,.86); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; min-width: 210px;
    backdrop-filter: blur(6px); pointer-events: none;
  }
  .overlay .row { display: flex; justify-content: space-between; gap: 14px; }
  .overlay .row + .row { margin-top: 3px; }
  .overlay .k { color: var(--dim); }
  .overlay .v { font-variant-numeric: tabular-nums; }
  .overlay .sep {
    height: 1px; background: var(--border); margin: 7px 0;
  }
  .overlay .v.good { color: var(--good); }
  .overlay .v.warn { color: var(--warn); }

  .status {
    position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center; flex-direction: column; gap: 12px;
    color: var(--dim); text-align: center; padding: 24px;
  }
  .status.error { color: #ff6b6b; }
  .status.hidden { display: none; }
  .status .big { font-size: 15px; color: var(--text); }
  .bar { width: 220px; height: 3px; background: #262b33; border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }

  /* 拾取结果面板 */
  .picker {
    position: absolute; right: 12px; bottom: 12px;
    background: rgba(20,22,26,.92); border: 1px solid var(--accent);
    border-radius: 8px; padding: 10px 12px 11px; width: 268px;
    backdrop-filter: blur(6px); font-size: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,.45);
  }
  .picker.hidden { display: none; }
  .picker .title {
    font-weight: 600; color: var(--text); margin-bottom: 8px; padding-right: 14px;
    word-break: break-all; line-height: 1.35;
  }
  .picker .row { display: flex; justify-content: space-between; gap: 10px; }
  .picker .row + .row { margin-top: 3px; }
  .picker .k { color: var(--dim); flex: none; }
  .picker .v { font-variant-numeric: tabular-nums; text-align: right; word-break: break-all; }
  .picker .v.good { color: var(--good); }
  .picker .v.mono { font-family: ui-monospace, Consolas, monospace; font-size: 10px; color: var(--dim); }
  .picker .sep { height: 1px; background: var(--border); margin: 7px 0; }
  .picker .close {
    position: absolute; right: 7px; top: 5px; color: var(--dim);
    cursor: pointer; font-size: 14px; line-height: 1; padding: 2px 4px;
  }
  .picker .close:hover { color: var(--text); }
  .picker .note { margin-top: 7px; color: var(--dim); font-size: 10px; line-height: 1.4; }

  footer {
    flex: none; padding: 7px 16px; border-top: 1px solid var(--border);
    background: var(--panel); color: var(--dim); font-size: 12px;
    display: flex; gap: 20px; align-items: center;
  }
  footer b { color: var(--text); font-weight: 600; }
</style>
</head>

<main>

</main>

<footer>
  <span><b>单击构件</b>查看属性 · <b>第一人称</b>按钮或 WASD 行走浏览内部 · <b>Esc</b> 取消选择/退出第一人称</span>
  <span class="spacer" style="flex:1"></span>
  <span>对比项：<b>加载耗时</b> · <b>存储三角形</b> · <b>每帧渲染三角形</b> · <b>Draw Call</b></span>
</footer>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/jsm/"
  }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

// ---- 模型路径（相对于本页面） ----------------------------------------
const MODELS = {
  fbx: { url: '../ljdd.fbx', label: 'ljdd.fbx' }
};

// 右侧 glTF 面板可在下拉中切换的模型列表
const GLTF_MODELS = [
  { url: '../output/ljdd_fine_default.gltf', label: 'ljdd_fine_default.gltf' },
  { url: '../output/ljdd_fine_1.00.gltf',   label: 'ljdd_fine_1.00.gltf' }
];
let gltfModelIndex = 0;

const TARGET_SIZE = 100;   // 归一化后的最大边长（场景单位）

// ---- 第一人称控制器（WASD 移动 + 左键拖拽转向，无需指针锁定） ------------
// 与 OrbitControls 并存，由 mode 切换；左键拖拽转向、单击（<5px）仍可拾取构件。
class FPSControls {
  constructor(camera, domElement) {
    this.camera = camera;
    this.domElement = domElement;
    this.enabled = false;

    this.movementSpeed = 15;      // 单位/秒
    this.runMultiplier = 3;       // 按住 Shift 加速倍数
    this.lookSpeed = 0.004;       // 弧度/像素（拖拽转向）

    this._f = this._b = this._l = this._r = false;
    this._u = this._d = this._run = false;
    this._drag = false;
    this._lastX = 0; this._lastY = 0;
    this.yaw = 0; this.pitch = 0;

    this._e = new THREE.Euler(0, 0, 0, 'YXZ');
    this._v1 = new THREE.Vector3();
    this._v2 = new THREE.Vector3();
    this._v3 = new THREE.Vector3();

    this._onKey = e => {
      const on = (e.type === 'keydown');
      let handled = false;
      switch (e.code) {
        case 'KeyW': case 'ArrowUp':    this._f = on; handled = true; break;
        case 'KeyS': case 'ArrowDown':  this._b = on; handled = true; break;
        case 'KeyA': case 'ArrowLeft':  this._l = on; handled = true; break;
        case 'KeyD': case 'ArrowRight': this._r = on; handled = true; break;
        case 'KeyR': case 'Space':      this._u = on; handled = true; break;
        case 'KeyF':                    this._d = on; handled = true; break;
        case 'ShiftLeft': case 'ShiftRight': this._run = on; handled = true; break;
      }
      if (handled && e.type === 'keydown') e.preventDefault();
    };
    this._onPointerDown = e => {
      if (e.button !== 0) return;
      this._drag = true;
      this._lastX = e.clientX; this._lastY = e.clientY;
      try { this.domElement.setPointerCapture(e.pointerId); } catch (_) {}
    };
    this._onPointerMove = e => {
      if (!this._drag) return;
      const dx = e.clientX - this._lastX;
      const dy = e.clientY - this._lastY;
      this._lastX = e.clientX; this._lastY = e.clientY;
      this.yaw   -= dx * this.lookSpeed;
      this.pitch -= dy * this.lookSpeed;
      const lim = Math.PI / 2 - 0.001;
      this.pitch = Math.max(-lim, Math.min(lim, this.pitch));
    };
    this._onPointerUp = () => { this._drag = false; };

    window.addEventListener('keydown', this._onKey);
    window.addEventListener('keyup', this._onKey);
    this.domElement.addEventListener('pointerdown', this._onPointerDown);
    this.domElement.addEventListener('pointermove', this._onPointerMove);
    this.domElement.addEventListener('pointerup', this._onPointerUp);

    this.syncOrientation();
  }

  /** 是否正在左键拖拽转向（用于同步模式下判定哪个面板是权威源） */
  get isDragging() { return this._drag; }

  /** 从相机当前朝向提取 yaw/pitch，用于从轨道模式无缝切入 */
  syncOrientation() {
    this._e.setFromQuaternion(this.camera.quaternion, 'YXZ');
    this.yaw = this._e.y;
    this.pitch = this._e.x;
  }

  update(delta) {
    if (!this.enabled) return;
    const dt = Math.min(delta, 0.1);

    // 朝向由拖拽累计的 yaw/pitch 决定
    this._e.set(this.pitch, this.yaw, 0);
    this.camera.quaternion.setFromEuler(this._e);

    // 平移
    const speed = this.movementSpeed * (this._run ? this.runMultiplier : 1) * dt;
    const fwd   = this._v1.set(0, 0, -1).applyQuaternion(this.camera.quaternion);
    const right = this._v2.set(1, 0, 0).applyQuaternion(this.camera.quaternion);
    const move  = this._v3.set(0, 0, 0);
    if (this._f) move.add(fwd);
    if (this._b) move.sub(fwd);
    if (this._r) move.add(right);
    if (this._l) move.sub(right);
    if (this._u) move.y += 1;
    if (this._d) move.y -= 1;
    if (move.lengthSq() > 0) this.camera.position.add(move.normalize().multiplyScalar(speed));
  }
}

// ---- 双视口 ------------------------------------------------------------
class Viewer {
  constructor(key) {
    this.key = key;
    this.container = document.getElementById('view-' + key);
    this.statusEl = document.getElementById('status-' + key);
    this.statsEl  = document.getElementById('stats-' + key);
    this.pickerEl = document.getElementById('pick-' + key);
    this.progressEl = document.getElementById('progress-' + key);

    this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    this.renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    this.renderer.outputColorSpace = THREE.SRGBColorSpace;
    this.container.appendChild(this.renderer.domElement);

    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x14161a);

    this.scene.add(new THREE.HemisphereLight(0xffffff, 0x2a2f38, 2.2));
    const key1 = new THREE.DirectionalLight(0xffffff, 1.8); key1.position.set(1, 1.4, 1); this.scene.add(key1);
    const key2 = new THREE.DirectionalLight(0xffffff, 0.9); key2.position.set(-1, 0.6, -1); this.scene.add(key2);

    this.camera = new THREE.PerspectiveCamera(45, 1, 0.1, 5000);
    this.camera.position.set(140, 100, 140);

    this.controls = new OrbitControls(this.camera, this.renderer.domElement);
    this.controls.enableDamping = true;
    this.controls.dampingFactor = 0.08;
    this.controls.enableZoom = true;

    // 第一人称控制器：进入车站内部浏览用，默认关闭，由「第一人称」按钮切换
    this.fps = new FPSControls(this.camera, this.renderer.domElement);
    this.fps.enabled = false;

    this.root = new THREE.Group();     // 归一化变换挂在这一层
    this.scene.add(this.root);

    this.stats = null;
    this.rawBox = null;

    this.controls.addEventListener('change', () => {
      if (this.onCameraChange) this.onCameraChange(this);
    });

    new ResizeObserver(() => this.resize()).observe(this.container);
    this.resize();
  }

  resize() {
    const w = this.container.clientWidth, h = this.container.clientHeight;
    if (!w || !h) return;
    this.renderer.setSize(w, h, false);
    this.camera.aspect = w / h;
    this.camera.updateProjectionMatrix();
  }

  setProgress(frac) {
    this.progressEl.style.width = (frac * 100).toFixed(0) + '%';
  }

  showError(msg) {
    this.statusEl.classList.remove('hidden');
    this.statusEl.classList.add('error');
    this.statusEl.innerHTML = '<div class="big">加载失败</div><div>' + msg + '</div>' +
      '<div style="max-width:420px;font-size:12px;opacity:.7">请确认：① 通过 HTTP 访问（file:// 会被 CORS 拦截）' +
      '　② CDN 可访问　③ 模型文件路径正确</div>';
  }

  /** 清空当前模型并释放 GPU 资源，回到"加载中"状态（用于切换模型） */
  clearModel() {
    if (this.object3d) {
      this.root.remove(this.object3d);
      disposeObject(this.object3d);
      this.object3d = null;
    }
    this.stats = null;
    this.rawBox = null;
    this.geomRefs = null;
    clearPick(this);
    this.statsEl.classList.add('hidden');
    this.statusEl.classList.remove('hidden', 'error');
    this.statusEl.innerHTML = '<div class="big">加载中…</div><div class="bar"><i id="progress-' + this.key + '"></i></div>';
    this.progressEl = document.getElementById('progress-' + this.key);
    this.setProgress(0);
  }

  /** 载入完成：设置归一化、统计、相机 */
  finish(object3d, meta, elapsedMs) {
    this.statusEl.classList.add('hidden');
    this.statsEl.classList.remove('hidden');

    // 原始包围盒（归一化前）
    this.rawBox = new THREE.Box3().setFromObject(object3d);
    const rawSize = this.rawBox.getSize(new THREE.Vector3());
    const rawCenter = this.rawBox.getCenter(new THREE.Vector3());

    this.object3d = object3d;
    this.root.add(object3d);
    this.applyOrientation();
    this.applyNormalize();

    // 几何引用计数：统计每个 geometry 被多少个 Mesh 对象共享。
    // 实例化导出时这个值会很大（一个族符号的几何被成百上千个实例共用），
    // 是拾取面板里最能说明实例化效果的一项。
    this.geomRefs = new Map();
    object3d.traverse(o => {
      if (o.isMesh && o.geometry)
        this.geomRefs.set(o.geometry, (this.geomRefs.get(o.geometry) || 0) + 1);
    });

    this.stats = {
      elapsedMs,
      bytes: meta.bytes,
      size: rawSize.clone(),
      center: rawCenter.clone(),
      geom: computeGeometryStats(object3d)
    };
    this.meta = meta;

    clearPick(this);
    this.fitCamera();
    this.renderStats();
  }

  applyNormalize() {
    if (!this.object3d || !this.rawBox) return;
    const on = document.getElementById('normalize').checked;
    const size = this.rawBox.getSize(new THREE.Vector3());
    const center = this.rawBox.getCenter(new THREE.Vector3());

    if (!on) {
      this.object3d.scale.setScalar(1);
      this.object3d.position.set(0, 0, 0);
      this.root.updateMatrixWorld(true);
      return;
    }
    const maxDim = Math.max(size.x, size.y, size.z) || 1;
    const s = TARGET_SIZE / maxDim;
    this.object3d.scale.setScalar(s);
    this.object3d.position.set(-center.x * s, -center.y * s, -center.z * s);
    this.root.updateMatrixWorld(true);
  }

  /**
   * Z-up（Revit 与插件导出的 glTF 都是 Z-up）→ Y-up（three.js 惯例）。
   * 绕 X 轴 -90°：(x,y,z) → (x, z, -y)，即原 Z 轴立起来成为向上方向。
   * 只旋转 root 这层包装，模型自身坐标与实例矩阵一概不动 —— 关掉开关即可回到原始朝向。
   */
  applyOrientation() {
    const on = document.getElementById('zup').checked;
    this.root.rotation.set(on ? -Math.PI / 2 : 0, 0, 0);
    this.root.updateMatrixWorld(true);
  }

  fitCamera() {
    const box = new THREE.Box3().setFromObject(this.root);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z) || 1;
    const fov = this.camera.fov * Math.PI / 180;
    const dist = (maxDim / 2 / Math.tan(fov / 2)) * 1.7;

    this.camera.position.set(center.x + dist * 0.75, center.y + dist * 0.6, center.z + dist * 0.75);
    this.camera.near = Math.max(dist / 5000, 0.02);   // 近裁剪面更小，进入内部贴近墙体不裁切
    this.camera.far = dist * 20;
    this.camera.updateProjectionMatrix();
    this.controls.target.copy(center);
    this.controls.update();
    this.fps.syncOrientation();
    this.home = { pos: this.camera.position.clone(), target: center.clone() };
  }

  resetView() {
    if (!this.home) return;
    this.camera.position.copy(this.home.pos);
    this.controls.target.copy(this.home.target);
    this.controls.update();
    this.fps.syncOrientation();
  }

  renderStats(fps) {
    if (!this.stats) return;
    const g = this.stats.geom;
    const info = this.renderer.info;
    const fmt = n => n.toLocaleString('en-US');
    const mb  = b => (b / 1048576).toFixed(1) + ' MB';

    const row = (k, v, cls) =>
      `<div class="row"><span class="k">${k}</span><span class="v ${cls || ''}">${v}</span></div>`;

    let html = '';
    html += row('文件大小', mb(this.stats.bytes));
    html += row('加载耗时', (this.stats.elapsedMs / 1000).toFixed(2) + ' s');
    html += row('包围盒 (m)', this.stats.size.toArray().map(v => v.toFixed(1)).join(' × '));
    html += '<div class="sep"></div>';
    html += row('存储三角形', fmt(Math.round(g.tris)));
    html += row('每帧渲染三角形', fmt(info.render.triangles), 'good');
    html += row('Draw Call', fmt(info.render.calls), 'good');
    html += row('顶点数', fmt(g.verts));
    html += row('Mesh 对象', fmt(g.meshes));
    html += row('唯一几何', fmt(g.geometries), g.meshes > g.geometries * 1.5 ? 'good' : '');
    html += row('材质数', fmt(g.materials));
    html += '<div class="sep"></div>';
    html += row('GPU 几何/贴图', info.memory.geometries + ' / ' + info.memory.textures);
    html += row('JS 堆内存', jsHeap(), jsHeap() === '—' ? '' : 'warn');
    if (fps) html += row('帧率', fps.toFixed(0) + ' fps');

    this.statsEl.innerHTML = html;
  }
}

function jsHeap() {
  const m = performance.memory;
  return m ? (m.usedJSHeapSize / 1048576).toFixed(0) + ' MB' : '—';
}

/** 统计几何：按 geometry 去重（实例化共享几何时此处最能体现差异） */
function computeGeometryStats(root) {
  let tris = 0, verts = 0, meshes = 0;
  const geos = new Set(), mats = new Set();
  root.traverse(o => {
    if (!o.isMesh) return;
    meshes++;
    const g = o.geometry;
    if (g && !geos.has(g)) {
      geos.add(g);
      const pos = g.attributes.position;
      if (pos) {
        verts += pos.count;
        tris += g.index ? g.index.count / 3 : pos.count / 3;
      }
    }
    if (o.material) {
      (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => mats.add(m));
    }
  });
  return { tris, verts, meshes, geometries: geos.size, materials: mats.size };
}

/** 递归释放对象树里的几何、材质与贴图，避免切换模型时 GPU 内存泄漏 */
function disposeObject(root) {
  const geos = new Set();
  root.traverse(o => {
    if (!o.isMesh) return;
    if (o.geometry && !geos.has(o.geometry)) {
      geos.add(o.geometry);
      o.geometry.dispose();
    }
    const mats = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []);
    mats.forEach(m => {
      for (const k in m) {
        const v = m[k];
        if (v && v.isTexture) v.dispose();
      }
      if (m.dispose) m.dispose();
    });
  });
}

/** HTTP HEAD 取文件字节数（glTF 需把 .bin 一并计入） */
async function probeBytes(url) {
  try {
    const r = await fetch(url, { method: 'HEAD' });
    return parseInt(r.headers.get('content-length') || '0', 10);
  } catch { return 0; }
}

/** 带进度回调的抓取（loader 自带的 onProgress 拿不到 Content-Length 时用它兜底） */
function progressHandler(viewer) {
  return ev => { if (ev.lengthComputable) viewer.setProgress(ev.loaded / ev.total); };
}

const viewers = { fbx: new Viewer('fbx'), gltf: new Viewer('gltf') };

// ---- 相机同步 ----------------------------------------------------------
let syncing = false;
viewers.fbx.onCameraChange = src => syncFrom(src);
viewers.gltf.onCameraChange = src => syncFrom(src);

function syncFrom(src) {
  if (syncing || !document.getElementById('sync-cam').checked) return;
  syncing = true;
  const dst = src === viewers.fbx ? viewers.gltf : viewers.fbx;
  dst.camera.position.copy(src.camera.position);
  dst.camera.quaternion.copy(src.camera.quaternion);
  dst.camera.zoom = src.camera.zoom;
  dst.camera.updateProjectionMatrix();
  dst.controls.target.copy(src.controls.target);
  dst.controls.update();
  syncing = false;
}

// ---- 加载 --------------------------------------------------------------
async function loadFbx(viewer) {
  const t0 = performance.now();
  const [bytes, obj] = await Promise.all([
    probeBytes(MODELS.fbx.url),
    new Promise((res, rej) => new FBXLoader().load(MODELS.fbx.url, res, progressHandler(viewer), rej))
  ]);
  // 英尺 → 米：把缩放烘焙进几何与节点平移，使 FBX 与 glTF 同单位。
  // 两个文件本就同原点（内部原点 XY + 绝对高程 Z），只差单位，烘焙后即可完全对齐。
  const FEET_TO_M = 0.3048;
  const scaledGeos = new Set();
  obj.traverse(o => {
    if (o.isMesh && o.geometry && !scaledGeos.has(o.geometry)) {
      scaledGeos.add(o.geometry);
      o.geometry.scale(FEET_TO_M, FEET_TO_M, FEET_TO_M);
    }
    if (o.position) o.position.multiplyScalar(FEET_TO_M);
  });

  obj.traverse(o => {
    if (o.isMesh) {
      // 与本插件导出的 glTF 保持一致的背面渲染设置，避免对比失真
      if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { m.side = THREE.DoubleSide; });
      o.frustumCulled = false;
    }
  });
  viewer.finish(obj, { bytes }, performance.now() - t0);
}

async function loadGltf(viewer, model) {
  const t0 = performance.now();
  const binUrl = model.url.replace(/\.gltf$/, '.bin');
  const [gltfBytes, binBytes, gltf] = await Promise.all([
    probeBytes(model.url),
    probeBytes(binUrl),
    new Promise((res, rej) => new GLTFLoader().load(model.url, res, progressHandler(viewer), rej))
  ]);
  gltf.scene.traverse(o => { if (o.isMesh) o.frustumCulled = false; });
  // glTF 总大小 = .gltf + .bin（.bin 是必需的几何数据，FBX 则是自包含单文件）
  viewer.finish(gltf.scene, { bytes: gltfBytes + binBytes, gltfBytes, binBytes }, performance.now() - t0);
}

// ---- 拾取 --------------------------------------------------------------
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();

const escHtml = s => String(s).replace(/[&<>"]/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtNum = n => Math.round(n).toLocaleString('en-US');

/** 高亮材质：克隆原材质并加自发光，避免污染被多个 Mesh 共享的材质实例 */
function toHighlight(m) {
  const c = m.clone();
  if (c.emissive) {
    c.emissive = new THREE.Color(0x2b6cb0);
    c.emissiveIntensity = 1.0;
  } else {
    c.color = new THREE.Color(0x4a9eff);   // 非标准材质（如基础材质）退化为换色
  }
  return c;
}

/** 清除拾取：还原材质、收起面板。keepPanel=true 用于切换到新目标时保留面板 */
function clearPick(viewer, keepPanel) {
  if (viewer.picked && viewer.pickedOriginal) {
    viewer.picked.material = viewer.pickedOriginal;
  }
  viewer.picked = null;
  viewer.pickedOriginal = null;
  if (!keepPanel && viewer.pickerEl) viewer.pickerEl.classList.add('hidden');
}

/** 点击拾取：把屏幕坐标转为 NDC 后对 root 递归求交 */
function pickAt(viewer, ev) {
  if (!viewer.object3d) return;
  const rect = viewer.renderer.domElement.getBoundingClientRect();
  pointerNDC.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
  pointerNDC.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointerNDC, viewer.camera);

  const t0 = performance.now();
  const hits = raycaster.intersectObject(viewer.root, true);
  const rayMs = performance.now() - t0;

  if (hits.length === 0) { clearPick(viewer); return; }
  applyPick(viewer, hits[0], rayMs);
}

function applyPick(viewer, hit, rayMs) {
  clearPick(viewer, true);
  const mesh = hit.object;

  viewer.picked = mesh;
  viewer.pickedOriginal = mesh.material;
  mesh.material = Array.isArray(mesh.material)
    ? mesh.material.map(toHighlight)
    : toHighlight(mesh.material);

  drawPicker(viewer, mesh, hit.point, rayMs);
}

function drawPicker(viewer, mesh, point, rayMs) {
  const g = mesh.geometry;
  const pos = g.attributes.position;
  const tris = g.index ? g.index.count / 3 : (pos ? pos.count / 3 : 0);
  const verts = pos ? pos.count : 0;
  const refs = viewer.geomRefs.get(g) || 1;
  const ud = mesh.userData || {};
  const mat = Array.isArray(mesh.material) ? mesh.material[0] : mesh.material;

  const row = (k, v, cls) =>
    `<div class="row"><span class="k">${k}</span><span class="v ${cls || ''}">${v}</span></div>`;

  const title = ud.name || mesh.name || '(未命名)';
  let html = `<span class="close" title="关闭">×</span>`;
  html += `<div class="title">${escHtml(title)}</div>`;

  // Revit 语义（插件导出时写入 glTF 节点的 extras，GLTFLoader 会放进 userData）
  if (ud.elementId !== undefined) html += row('元素ID', escHtml(ud.elementId));
  if (mesh.name) html += `<div class="row"><span class="k">节点名</span><span class="v mono">${escHtml(mesh.name)}</span></div>`;

  html += '<div class="sep"></div>';
  html += row('三角形', fmtNum(tris));
  html += row('顶点', fmtNum(verts));
  html += row('材质', escHtml((mat && mat.name) || '—'));
  html += row('共享该几何', refs + ' 个对象', refs > 1 ? 'good' : '');

  html += '<div class="sep"></div>';
  // 换算回模型原始坐标（抵消 Y-up 旋转与归一化），便于与 Revit 中的位置对照
  const local = viewer.object3d.worldToLocal(point.clone());
  html += row('模型坐标', `${local.x.toFixed(1)}, ${local.y.toFixed(1)}, ${local.z.toFixed(1)}`);
  html += row('拾取耗时', rayMs.toFixed(0) + ' ms');

  if (refs > 1) {
    html += `<div class="note">该几何被 ${refs} 个对象共享 —— 只存了一份顶点数据，其余靠变换矩阵复用。</div>`;
  }

  viewer.pickerEl.innerHTML = html;
  viewer.pickerEl.classList.remove('hidden');
  viewer.pickerEl.querySelector('.close').addEventListener('click', () => clearPick(viewer));
}

function setupPicking(viewer) {
  const el = viewer.renderer.domElement;
  let downX = 0, downY = 0;
  el.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; });
  el.addEventListener('pointerup', e => {
    // 拖拽旋转/平移超过阈值时不触发拾取，避免误选
    if (Math.hypot(e.clientX - downX, e.clientY - downY) > 5) return;
    pickAt(viewer, e);
  });
}

// ---- 操控模式：轨道 / 第一人称 ----------------------------------------
let mode = 'orbit';   // 'orbit' | 'fps'

function setMode(m) {
  mode = m;
  const isFps = (m === 'fps');
  document.getElementById('mode-toggle').textContent = isFps ? '退出第一人称' : '第一人称 (WASD)';
  document.getElementById('mode-toggle').classList.toggle('active', isFps);
  document.getElementById('mode-hint').classList.toggle('hidden', !isFps);

  for (const v of Object.values(viewers)) {
    v.controls.enabled = !isFps;
    v.fps.enabled = isFps;
    if (isFps) {
      v.fps.syncOrientation();   // 继承当前轨道相机朝向，无缝切入
    } else {
      // 回到轨道：把轨道中心放到相机前方，避免目标落在身后导致旋转怪异
      const fwd = new THREE.Vector3();
      v.camera.getWorldDirection(fwd);
      v.controls.target.copy(v.camera.position).addScaledVector(fwd, 20);
      v.controls.update();
    }
  }
}

/** 第一人称模式下的相机镜像（fbx 权威 → gltf） */
function mirrorCamera(src, dst) {
  dst.camera.position.copy(src.camera.position);
  dst.camera.quaternion.copy(src.camera.quaternion);
}

// ---- 渲染循环 ----------------------------------------------------------
let last = performance.now(), fpsAcc = 0, fpsCount = 0, fps = 0, statsTimer = 0;

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now(), dt = now - last; last = now;
  if (dt > 0) { fpsAcc += 1000 / dt; fpsCount++; }

  // 每 500ms 汇总一次 FPS 并刷新统计面板（renderer.info 每帧重置，需在渲染后读取）
  if (now - statsTimer > 500) {
    statsTimer = now;
    if (fpsCount) { fps = fpsAcc / fpsCount; fpsAcc = 0; fpsCount = 0; }
  }

  const delta = Math.min(dt / 1000, 0.1);   // 秒；大帧间隔截断防止瞬移
  if (mode === 'fps') {
    const synced = document.getElementById('sync-cam').checked;
    // 左键拖拽转向在哪一侧面板都应生效：谁正在拖拽谁就是权威源（未拖拽时默认 fbx）
    const active = synced && viewers.gltf.fps.isDragging ? viewers.gltf : viewers.fbx;
    active.fps.update(delta);
    if (synced) {
      const other = active === viewers.fbx ? viewers.gltf : viewers.fbx;
      other.fps.yaw = active.fps.yaw;       // 保持两侧朝向一致，切换拖拽侧不跳变
      other.fps.pitch = active.fps.pitch;
      mirrorCamera(active, other);          // 同步相机：镜像到另一侧
    } else {
      viewers.gltf.fps.update(delta);       // 未同步：两视口各自控制
    }
  } else {
    for (const v of Object.values(viewers)) v.controls.update();
  }

  for (const v of Object.values(viewers)) v.renderer.render(v.scene, v.camera);
  // 渲染后读 info（每帧的 draw call / triangle 统计）
  for (const v of Object.values(viewers)) v.renderStats(fps);
}
animate();

// ---- 交互 --------------------------------------------------------------
document.getElementById('mode-toggle').addEventListener('click', () => {
  setMode(mode === 'fps' ? 'orbit' : 'fps');
});
document.getElementById('reset-view').addEventListener('click', () => {
  viewers.fbx.resetView(); viewers.gltf.resetView();
});
document.getElementById('normalize').addEventListener('change', () => {
  for (const v of Object.values(viewers)) {
    if (!v.object3d) continue;
    clearPick(v);
    v.applyNormalize();
    v.fitCamera();
  }
});

document.getElementById('zup').addEventListener('change', () => {
  for (const v of Object.values(viewers)) {
    if (!v.object3d) continue;
    clearPick(v);
    v.applyOrientation();
    v.fitCamera();
  }
});

window.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (mode === 'fps') setMode('orbit');
    else for (const v of Object.values(viewers)) clearPick(v);
  }
});

// ---- 启动 --------------------------------------------------------------
for (const v of Object.values(viewers)) setupPicking(v);

// glTF 模型切换下拉
const gltfSelect = document.getElementById('gltf-model-select');
for (const m of GLTF_MODELS) {
  const opt = document.createElement('option');
  opt.value = m.label;
  opt.textContent = m.label;
  gltfSelect.appendChild(opt);
}
gltfSelect.addEventListener('change', async () => {
  const index = gltfSelect.selectedIndex;
  if (index === gltfModelIndex) return;
  gltfModelIndex = index;
  const viewer = viewers.gltf;
  gltfSelect.disabled = true;              // 加载期间禁用，避免并发切换
  viewer.clearModel();
  try {
    await loadGltf(viewer, GLTF_MODELS[index]);
  } catch (e) {
    console.error(e);
    viewer.showError(String(e && e.message || e));
  } finally {
    gltfSelect.disabled = false;
  }
});

loadFbx(viewers.fbx).catch(e => {
  console.error(e);
  viewers.fbx.showError(String(e && e.message || e));
});
loadGltf(viewers.gltf, GLTF_MODELS[gltfModelIndex]).catch(e => {
  console.error(e);
  viewers.gltf.showError(String(e && e.message || e));
});

// 加载完成后在控制台输出一份可复制的对比表
window.addEventListener('load', () => {
  const t = setInterval(() => {
    const a = viewers.fbx.stats, b = viewers.gltf.stats;
    if (!a || !b) return;
    clearInterval(t);
    console.table({
      '文件大小(MB)':    { FBX: (a.bytes / 1048576).toFixed(1), glTF: (b.bytes / 1048576).toFixed(1) },
      '加载耗时(s)':     { FBX: (a.elapsedMs / 1000).toFixed(2), glTF: (b.elapsedMs / 1000).toFixed(2) },
      '存储三角形':      { FBX: Math.round(a.geom.tris), glTF: Math.round(b.geom.tris) },
      '顶点数':          { FBX: a.geom.verts, glTF: b.geom.verts },
      'Mesh 对象':       { FBX: a.geom.meshes, glTF: b.geom.meshes },
      '唯一几何':        { FBX: a.geom.geometries, glTF: b.geom.geometries },
      '材质数':          { FBX: a.geom.materials, glTF: b.geom.materials }
    });
  }, 300);
});
</script>
</body>
</html>
